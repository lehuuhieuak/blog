name: minimal-blog-production

services:
  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE must be an immutable GHCR digest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: "no"

  api:
    image: ${API_IMAGE:?API_IMAGE must be an immutable GHCR digest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HTTP_ADDR: :8080
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable GHCR digest}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
