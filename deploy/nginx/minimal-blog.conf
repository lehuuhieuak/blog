# Replace blog.example.com, the certificate paths, and 203.0.113.10 before use.
# Nginx is the only public ingress. Docker binds the application ports to loopback.

upstream minimal_blog_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream minimal_blog_web {
    server 127.0.0.1:4321;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The exact and prefix locations together prevent bypassing the admin allowlist.
    location = /quan-tri {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://minimal_blog_web;
    }

    location ^~ /quan-tri/ {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://minimal_blog_web;
    }

    location = /api/v1/admin {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://minimal_blog_api;
    }

    location ^~ /api/v1/admin/ {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://minimal_blog_api;
    }

    location ^~ /api/v1/ {
        proxy_pass http://minimal_blog_api;
    }

    location = /healthz {
        proxy_pass http://minimal_blog_api;
    }

    location = /readyz {
        proxy_pass http://minimal_blog_api;
    }

    location / {
        proxy_pass http://minimal_blog_web;
    }
}
